[project]
name = "opencode-remote-maf-handoff-bridge"
version = "0.1.0"
description = "Test-only FastAPI/WebSocket bridge exposing a Microsoft Agent Framework handoff workflow to OpenCode's /agent remote picker. Standalone: will move out of the opencode workspace once stable."
requires-python = ">=3.11"
dependencies = [
  "agent-framework-orchestrations>=1.1.1,<2",
  "agent-framework-openai>=1.14.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=12,<15",
  "pydantic>=2,<3",
  "openinference-instrumentation-agent-framework>=0.1.9,<1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-timeout>=2.3,<3",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 20
